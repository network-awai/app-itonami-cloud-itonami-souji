# Itonami-only definition: itonami.edn makes this profile an itonami agent
# (ADR-2610222100). A Hermes profile must not use murakumo or mishima.
model:
  provider: murakumo
  default: mishima
  base_url: https://api.murakumo.cloud/v1
  context_length: 131072
  max_tokens: 8192
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
    api_mode: chat_completions
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
fallback_providers: []
auxiliary:
  compression:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  title_generation:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  web_extract:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  mcp:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  skills_hub:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  vision:
    provider: murakumo
    model: qwen3-vl-2b-instruct
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  approval:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  triage_specifier:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
agent:
  max_turns: 80
approvals:
  mode: 'off'
gateway:
  cron_only: true
